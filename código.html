<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Giovanna Carvalho | Estética e bem-estar</title>
<meta name="description" content="Giovanna Carvalho: drenagem linfática, microagulhamento, jato de plasma e limpeza de pele profunda. Atendimento no espaço ou em domicílio.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ivory:#FAF8F5;--sage:#9DB0A3;--ink:#1F2421;--olive:#2F4A3C;--line:#E4E7E1;--mint:#EEF3EF;--blush:#F6EFE9;--sand:#F4F0EA;--leaf:#EEF3EF;--gold:#B08D57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ivory:#FAF8F5;--ink:#1F2421}}
:root[data-theme="dark"]{--ivory:#FAF8F5;--ink:#1F2421}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{background:var(--ivory);color:var(--ink);font:300 17px/1.7 Jost,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.15}
h1{font-size:clamp(2.4rem,6vw,4.1rem)}h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:.6rem}h3{font-size:1.45rem}
a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:0 24px}section{padding:84px 0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
body>header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(250,248,245,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-family:"Cormorant Garamond",serif;font-size:1.35rem;font-weight:600;color:var(--olive)}
nav{display:flex;gap:22px;font-size:.93rem}nav a:hover{color:var(--olive)}.act{display:flex;align-items:center;gap:14px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.igi{display:inline-flex;color:var(--olive);transition:.25s}.igi:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:10px;border:1px solid var(--olive);font-weight:400;font-size:.97rem;cursor:pointer;transition:.25s;background:none;color:var(--olive);font-family:inherit;line-height:1.4;text-align:center}
.btn.fill{background:var(--olive);color:#fff}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,91,73,.18)}.btn.sm{padding:9px 18px}
[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
.lead{max-width:38em;color:#4b514a}.btns{display:flex;flex-wrap:wrap;gap:14px}
.hero{padding:72px 0 96px;background:linear-gradient(135deg,var(--mint),var(--blush) 70%,var(--ivory))}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.hero p{max-width:30em;margin:22px 0 32px;color:#454b44}
.tag{display:inline-block;font-size:.9rem;color:var(--olive);border-bottom:1px solid var(--olive);padding-bottom:4px;margin-bottom:22px}
.mono{display:grid;place-items:center;font:500 4rem "Cormorant Garamond",Georgia,serif;color:rgba(255,255,255,.85);letter-spacing:.05em}
.hero-img{border-radius:200px 200px 14px 14px;aspect-ratio:4/5;background:linear-gradient(160deg,var(--sage),var(--olive));border:6px solid rgba(255,255,255,.7);width:100%}
.about .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px;align-items:center}
.photo{position:relative;isolation:isolate}.photo .mono{width:100%;border-radius:14px;aspect-ratio:4/5;background:linear-gradient(160deg,var(--sage),var(--olive))}
.photo img{width:100%;height:auto;display:block;border-radius:14px;aspect-ratio:4/5;object-fit:cover;object-position:35% 20%}
.photo:after{content:"";position:absolute;inset:16px -16px -16px 16px;border-radius:14px;background:var(--blush);z-index:-1}
.about p{margin:14px 0 22px;color:#454b44}
.proc{background:#EEF1E9}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 8px}
.chip{padding:8px 20px;border-radius:30px;border:1px solid var(--sage);background:var(--ivory);font:inherit;font-size:.92rem;color:var(--olive);cursor:pointer;transition:.25s}
.chip[aria-selected=true],.chip:hover{background:var(--olive);color:#fff;border-color:var(--olive)}
.topic{margin-top:44px}.topic>p{color:#4b514a;max-width:40em}.sub{margin:26px 0 12px;font-weight:500;color:var(--olive);display:flex;align-items:center;gap:10px}
.sub:after{content:"";flex:1;height:1px;background:var(--sage);opacity:.6}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:20px}
.item{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:.25s}
.item:hover{box-shadow:0 12px 28px rgba(80,91,73,.14);transform:translateY(-3px)}
.item-h{padding:18px 22px 14px;background:var(--tc)}.item h4{font:500 1.35rem/1.2 "Cormorant Garamond",serif}
.body{padding:16px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}.body p{font-size:.93rem;color:#555c54}
.ben{list-style:none;padding:0;font-size:.9rem;display:grid;gap:6px;margin-bottom:6px}.ben li{padding-left:20px;position:relative}
.ben li:before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.item .btn{margin-top:auto}.disc{margin-top:36px;font-size:.88rem;color:#5d645c;padding:16px 20px;border-radius:12px;background:var(--ivory);border:1px dashed var(--sage)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:32px}.opt{border-radius:16px;padding:32px}.opt p{margin:10px 0 18px;color:#454b44}
.opt.a{background:var(--mint)}.opt.b{background:var(--blush)}
.anam{background:var(--sand)}.form{background:#fff;border-radius:16px;padding:32px;margin-top:30px;display:grid;gap:22px;border:1px solid var(--line)}
fieldset{border:0;padding:0;display:grid;gap:14px;min-width:0}legend{font:500 1.3rem "Cormorant Garamond",serif;color:var(--olive);margin-bottom:6px;padding:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}label{font-size:.9rem;display:grid;gap:5px}
input[type=text],input[type=date],input[type=tel],select,textarea{font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--sage);border-radius:10px;background:var(--ivory);color:var(--ink);width:100%}
textarea{min-height:84px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:8px 18px}
.ck{display:flex;gap:10px;align-items:center;font-size:.92rem}.ck input{accent-color:var(--olive);width:17px;height:17px;flex:none}.small{font-size:.84rem;color:#5d645c}
